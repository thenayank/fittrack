<style>:root{--bg:#F2F2F7;--card:#FFFFFF;--el:#FFFFFF;--tx:#000;--mu:rgba(60,60,67,.6);--mu2:rgba(60,60,67,.3);--sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);

.dark{--bg:#000;--card:#1C1C1E;--el:#2C2C2E;--tx:#fff;--mu:rgba(235,235,245,.6);--mu2:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);
--tint:#0A84FF;--green:#30D158;--orange:#FF9F0A;--gold:#FFD60A;--glass:rgba(28,28,30,.72);--sh:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 17px/22px var(--font);letter-spacing:-.022em;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .3s var(--ease)}
.num{font-variant-numeric:tabular-nums;font-family:var(--round)}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(120px + env(safe-area-inset-bottom))}
.screen{animation:in .32s var(--emph) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{position:sticky;top:0;z-index:20;margin:0 -16px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;min-height:44px;background:transparent;transition:background .2s}
.top.stuck{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.top .it{font:600 17px/22px var(--font);opacity:0;transition:opacity .2s}.top.stuck .it{opacity:1}
.lt{font:700 34px/41px var(--font);letter-spacing:-.01em;margin:4px 0 16px}
.eyebrow{font:600 13px/18px var(--font);color:var(--mu);text-transform:uppercase;letter-spacing:.02em;margin:0}
h2{font:600 22px/28px var(--font);margin:24px 0 8px}
.sec{font:600 13px/18px var(--font);text-transform:uppercase;color:var(--mu);margin:24px 16px 8px;letter-spacing:.01em}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{font:600 17px/22px var(--font);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:15px;line-height:20px}.fn{font-size:13px;line-height:18px;color:var(--mu)}.cap{font-size:12px;line-height:16px;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center}.row.w{flex-wrap:wrap}.sp{flex:1}.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.list{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:44px;position:relative;background:none;border:0;width:100%;text-align:left;color:inherit;font:inherit}
.li+.li::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.li .t{flex:1;min-width:0}.li .t b{font-weight:400;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .t span{font-size:13px;color:var(--mu)}
.li .chev{color:var(--mu2)}.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico svg.i{width:18px;height:18px}
button,.btn{font:600 17px/22px var(--font);letter-spacing:-.022em;border:0;border-radius:14px;padding:13px 20px;background:var(--tint);color:#fff;cursor:pointer;min-height:44px;transition:transform .12s var(--ease),opacity .12s,background .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active,.btn:active,.press:active{transform:scale(.97)}
button.s{background:var(--fill);color:var(--tint)}button.p{border-radius:999px}button.g{background:none;color:var(--tint);padding:8px 10px;min-height:36px}
button.sm{font-size:15px;padding:7px 14px;min-height:34px;border-radius:999px}button.block{width:100%}
button.ic{background:var(--fill);color:var(--tx);width:36px;height:36px;min-height:36px;padding:0;border-radius:999px}
button.danger{color:#FF3B30}
:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 60%,transparent);outline-offset:2px}
input,select,textarea{font:400 17px/22px var(--font);width:100%;padding:11px 14px;border:0;border-radius:12px;background:var(--fill);color:var(--tx);min-height:44px;appearance:none;-webkit-appearance:none}
textarea{resize:vertical}select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
label.f{display:block;font-size:13px;color:var(--mu);margin:0 0 4px 4px}.fld{flex:1;min-width:0}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}.seg button{flex:1;background:none;color:var(--tx);font:500 13px/18px var(--font);padding:6px 4px;min-height:32px;border-radius:8px}
.seg button.on{background:var(--el);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 14px;background:var(--fill);color:var(--tx);font:500 15px/20px var(--font);min-height:34px;border:0;cursor:pointer}
.chip.on{background:var(--tint);color:#fff}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font:600 12px/16px var(--font);background:var(--fill);color:var(--mu)}
.pill.pg{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}.pill.pd{background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--tint)}
.pill.po{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.bar{height:6px;border-radius:99px;background:var(--fill);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--green);transition:width .9s var(--emph)}
/* rings */
.hero{display:flex;align-items:center;gap:20px}
.rings{width:150px;height:150px;flex:none}.rings circle{fill:none;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.rings .arc{transition:stroke-dashoffset .9s var(--emph)}
.legend{flex:1;display:flex;flex-direction:column;gap:10px}.legend .k{font-size:13px;font-weight:600;line-height:16px}
.legend .v{font:700 22px/26px var(--round);font-variant-numeric:tabular-nums;letter-spacing:-.02em}.legend .v small{font-size:15px;color:var(--mu);font-weight:500}
.big{font:700 48px/52px var(--round);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:flex;width:100%;max-width:640px}
.tabbar button{flex:1;flex-direction:column;gap:2px;background:none;color:var(--mu);font:500 10px/12px var(--font);letter-spacing:.01em;padding:6px 0 4px;min-height:49px;border-radius:0}
.tabbar button.on{color:var(--tint)}.tabbar button svg{width:26px;height:26px}.tabbar button.on svg{stroke-width:2.1}
.fab{position:fixed;right:max(20px,calc(50% - 300px));bottom:calc(68px + env(safe-area-inset-bottom));z-index:41;width:58px;height:58px;border-radius:999px;padding:0;background:var(--tint);box-shadow:0 8px 24px color-mix(in srgb,var(--tint) 45%,transparent);transition:transform .25s var(--spring)}
.fab svg{width:28px;height:28px;stroke-width:2.4;transition:transform .3s var(--spring)}.fab.open svg{transform:rotate(45deg)}
/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);opacity:0;transition:opacity .35s var(--ease);pointer-events:none}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;margin:0 auto;max-width:640px;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .45s var(--emph);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.on{transform:none}.sheet .grab{width:36px;height:5px;border-radius:9px;background:var(--mu2);margin:6px auto 0;flex:none}
.sheet .hd{display:flex;align-items:center;gap:8px;padding:10px 16px 8px;flex:none}.sheet .hd h3{flex:1;margin:0;font:600 17px/22px var(--font);text-align:center}
.sheet .bd{overflow:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.search{position:relative}.search svg{position:absolute;left:10px;top:11px;width:20px;height:20px;color:var(--mu)}.search input{padding-left:38px;border-radius:12px}
mark{background:none;color:var(--tint);font-weight:600}
.res .star{background:none;color:var(--mu2);padding:4px;min-height:36px;width:36px}.res .star.on{color:var(--gold)}.res .star.on svg{fill:currentColor}
.preview{text-align:center;padding:8px 0 4px}.preview .big{display:block}
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:12px}.stepper button{background:none;color:var(--tint);font-size:22px;width:44px;padding:0}.stepper input{background:none;text-align:center;width:48px;min-width:0;padding:0;font-weight:600}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));z-index:80;transform:translate(-50%,-140%);background:var(--el);color:var(--tx);padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.18);font:600 15px/20px var(--font);transition:transform .45s var(--spring);max-width:92%;display:flex;gap:8px;align-items:center}
.dark #toast{box-shadow:0 0 0 .5px var(--sep)}#toast.on{transform:translate(-50%,0)}#toast svg{color:var(--green)}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
.slot{display:flex;gap:12px;padding:12px 16px;position:relative}.slot+.slot::before{content:"";position:absolute;top:0;left:76px;right:0;height:.5px;background:var(--sep)}
.slot .tm{width:48px;flex:none;font:600 15px/20px var(--round);font-variant-numeric:tabular-nums;color:var(--mu);padding-top:1px}
.slot .bx{flex:1;min-width:0}.slot .bx b{font-weight:600;font-size:15px}.slot .acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.slot.now .tm{color:var(--tint)}.slot.locked .bx b::after{content:" · locked";color:var(--orange);font-weight:500;font-size:13px}
.week{display:grid;gap:8px}.wd{cursor:pointer;min-width:0;overflow:hidden;transition:transform .12s var(--ease);background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}.wd.today{box-shadow:inset 0 0 0 2px var(--tint)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .h{font-size:12px;color:var(--mu);padding:4px 0}
.cal button{background:var(--card);color:var(--tx);border-radius:12px;padding:6px 0;min-height:52px;flex-direction:column;gap:2px;font:600 15px/18px var(--round)}
.cal button i{width:6px;height:6px;border-radius:9px;background:var(--mu2)}.cal button i.ok{background:var(--green)}.cal button.today{color:var(--tint);box-shadow:inset 0 0 0 2px var(--tint)}.cal button.pad{visibility:hidden}
.chk{display:flex;gap:12px;align-items:center;padding:10px 16px;position:relative}.chk input{display:none}
.chk .bx{width:24px;height:24px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--mu2);display:grid;place-items:center;flex:none;transition:.2s}
.chk input:checked+.bx{background:var(--green);box-shadow:none}.chk input:checked+.bx::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:checked~.t{color:var(--mu);text-decoration:line-through}
.chk+.chk::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
canvas.chart{width:100%;height:220px;display:block}
.badge{display:inline-flex;flex-direction:column;align-items:center;width:calc(33.3% - 8px);margin:4px;padding:12px 4px;border-radius:16px;background:var(--fill);font-size:12px;line-height:15px;text-align:center;vertical-align:top}
.badge b{font-size:30px;line-height:38px}.badge.no{opacity:.35;filter:grayscale(1)}
details{border-radius:14px;padding:0}details+details{border-top:.5px solid var(--sep)}summary{font-weight:600;cursor:pointer;list-style:none;padding:12px 0;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}summary::after{content:"+";color:var(--mu);font-weight:400}details[open] summary::after{content:"−"}details p,details div{color:var(--mu);font-size:15px;line-height:21px;margin:0 0 12px}
.glass-row{display:flex;gap:6px;flex-wrap:wrap}.gl{width:28px;height:36px;border-radius:4px 4px 8px 8px;box-shadow:inset 0 0 0 1.5px var(--cyan);position:relative;overflow:hidden;cursor:pointer;background:none;padding:0;min-height:0}
.gl::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:var(--cyan);transition:height .35s var(--spring)}.gl.f::after{height:80%}
.empty{text-align:center;padding:24px 8px;color:var(--mu)}
.nudge{border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--green) 12%,var(--card));font-size:15px;line-height:20px}
.warn{background:color-mix(in srgb,var(--orange) 14%,var(--card))}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.08ms!important;scroll-behavior:auto!important}.screen{animation:none}}
@media (prefers-contrast:more){:root{--mu:rgba(60,60,67,.85);--sep:rgba(60,60,67,.5)}.dark{--mu:rgba(235,235,245,.85)}}
@media (min-width:700px){main{padding-left:20px;padding-right:20px}}
/* ===== v3 additions ===== */
:root{--mu:rgba(60,60,67,.72)}.dark{--sep:rgba(84,84,88,.45)}
.err{color:#FF3B30;font-size:13px;line-height:18px;margin:0 4px;min-height:0}.err:empty{display:none}
button:disabled{opacity:.4;cursor:default;transform:none}
button.ic{width:44px;height:44px;min-height:44px}button.g{min-height:44px;padding:10px 12px}button.sm{min-height:44px;padding:10px 16px}
.chip{min-height:44px;padding:10px 14px}.seg button{min-height:40px}.seg{padding:2px;min-height:44px}
.res .star{width:44px;min-height:44px}.qadd{background:var(--fill);color:var(--tint);width:44px;height:44px;min-height:44px;padding:0;border-radius:999px;flex:none}.qadd svg{width:20px;height:20px}

  for(const k of MEALSLOTS){if(keep&&old[k]?.lock){pick[k]=old[k];continue}const opts=COMBOS[k].filter(cb=>mainsOK(cb,avoid)&&cb.every(([id])=>STAPLE.has(id)||!used.has(id))&&cb.every(([id])=>okFood(id)));

  const sc=Math.abs(tot.kcal-T)/T*60+Math.max(0,P-tot.p)/P*200;if(!best||sc<best.sc)best={sc,pick}}

 const stepOf=f=>f.unit==='g'?25:f.unit==='piece'?1:f.unit==='scoop'?.5:.5;
 let best=null;const snap=()=>JSON.stringify(MEALSLOTS.map(k=>d[k].items));
 for(let it=0;it<200;it++){const tot=dayTot(d),dk=tot.kcal-T,pk=tot.p-P;const sc=Math.max(0,Math.abs(dk)/T-.025)*2+Math.max(0,-pk/P-.02)*3+Math.max(0,pk/P-.04);if(!best||sc<best.sc)best={sc,s:snap()};
  const kOK=Math.abs(dk)<=T*.025,pLow=pk<-P*.02,pHigh=pk>P*.03;if(kOK&&!pLow&&!pHigh)break;const cand=[];
  MEALSLOTS.forEach(k=>{if(d[k].lock)return;d[k].items.forEach((x,i)=>{const f=FOODS[x[0]];if(!f)return;const st=stepOf(f),n=nut(f,f.unit,st);if(n.kcal<10)return;const pd=n.p*4/Math.max(1,n.kcal);
   const mn=f.unit==='g'?50:f.unit==='piece'?1:.5,cap=CAP[x[0]]??(f.unit==='piece'?6:f.unit==='g'?200:2);
   cand.push({k,i,st,pd,kc:n.kcal,canUp:qOf(x[0])+st<=cap+1e-9&&okFood(x[0]),canDown:x[1]-st>=mn-1e-9})})});
  let act=null;
  const lowDn=cand.filter(c=>c.canDown&&c.pd<.25).sort((a,b)=>a.pd-b.pd)[0];
  if(pLow&&dk>T*.01&&lowDn){act=[lowDn,-1]}
  else if(pLow){const up=cand.filter(c=>c.canUp&&c.pd>=.3).sort((a,b)=>b.pd-a.pd)[0];
   const top=TOPUP().filter(([id,,,])=>!MEALSLOTS.some(k=>d[k].items.some(x=>x[0]===id))).map(([id,cap,slot,st])=>({id,slot,st,pd:nut(FOODS[id],FOODS[id].unit,st).p*4/Math.max(1,nut(FOODS[id],FOODS[id].unit,st).kcal)})).filter(t=>!d[t.slot].lock).sort((a,b)=>b.pd-a.pd)[0];
   if(top&&(!up||top.pd>up.pd+.05)){d[top.slot].items.push([top.id,top.st]);continue}
   if(up){act=[up,1]}else if(dk>T*.025){const dn=cand.filter(c=>c.canDown).sort((a,b)=>a.pd-b.pd)[0];if(dn)act=[dn,-1]}}

  else if(pHigh){const up=cand.filter(c=>c.canUp).sort((a,b)=>a.pd-b.pd)[0];if(up)act=[up,1]}
  else if(dk>0){const dn=cand.filter(c=>c.canDown).sort((a,b)=>a.pd-b.pd)[0];if(dn)act=[dn,-1]}
  else{const up=cand.filter(c=>c.canUp).sort((a,b)=>pk<P*.05?b.pd-a.pd:a.pd-b.pd)[0];if(up)act=[up,1]}
  if(!act)break;const[c,sg]=act;const x=d[c.k].items[c.i];x[1]=R1(x[1]+sg*c.st);if(x[1]<=0)d[c.k].items.splice(c.i,1)}
 {const tot=dayTot(d),sc=Math.max(0,Math.abs(tot.kcal-T)/T-.025)*2+Math.max(0,-(tot.p-P)/P-.02)*3+Math.max(0,(tot.p-P)/P-.04);if(best&&best.sc<sc)JSON.parse(best.s).forEach((it,i)=>d[MEALSLOTS[i]].items=it)}}
